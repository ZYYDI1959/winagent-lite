# 复制为 config.yaml 后按需修改；不存在的键用默认值
ollama_url: http://localhost:11434
vision_model: qwen2.5vl:7b   # 已验证可用：qwen2.5vl:3b / qwen2.5vl:7b / qwen3.8:27b

# ---- 性能与资源开销 ----
max_image_width: 1600        # 截图降采样宽度：越小模型处理越快；老机器建议 1024
image_format: png            # png | jpeg（jpeg 请求体小约 10 倍，识别无感）
capture_monitor: 0           # 0=所有显示器并集；1=仅主显示器（单屏/老机器建议 1）
typing_interval_ms: 10       # 打字间隔：越大越稳、越小越快；中文 IME 环境建议 >=10
request_timeout: 240

# 模型常驻免加载：在 Ollama 服务器端设环境变量 OLLAMA_KEEP_ALIVE（如 "10m"）即可，
# 全项目全局生效，无需在请求里传参。