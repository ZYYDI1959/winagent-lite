[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winagent"
version = "0.1.0"
description = "Local vision-driven Windows GUI agent with a reproducible benchmark"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "mss>=9.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
winagent = "winagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
