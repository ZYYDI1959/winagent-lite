[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winagent"
version = "0.3.0"
description = "Local vision-driven GUI agent with a reproducible benchmark (Windows/macOS/Linux)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "mss>=9.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
winagent = "winagent.cli:main"
winagent-mcp = "winagent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
